<style>
  /* page transition */
  .page-fade { animation: pageFade .45s cubic-bezier(.2,.7,.3,1); }
  @keyframes pageFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* tweak panel custom controls */
  .tw-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 0; }
  .tw-row-label { font-size: 13px; font-weight: 500; color: var(--ink-2, #555); }
  .tw-swatches { display: flex; gap: 8px; }
  .tw-swatch {
    width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
    background: var(--sw); border: 2px solid transparent;
    box-shadow: 0 0 0 1px rgba(0,0,0,.12) inset;
    transition: transform .15s, box-shadow .15s; padding: 0;
  }
  .tw-swatch:hover { transform: scale(1.12); }
  .tw-swatch.on { box-shadow: 0 0 0 2px var(--surface, #fff), 0 0 0 4px var(--sw); }

  /* loading splash */
  #boot { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 9999; transition: opacity .4s; }
  #boot.gone { opacity: 0; pointer-events: none; }
  #boot .dot { width: 9px; height: 9px; border-radius: 50%; background: oklch(0.72 0.17 150); animation: pulse 1.6s infinite; }
</style>
  <script type="module" crossorigin src="/assets/index-RPHQWMik.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-D60QoBYW.css">
</head>
<body>
<div id="boot"><span class="dot"></span></div>
<div id="root"></div>


<script>
  // hide boot splash once React paints
  (function () {
    const hide = () => { const b = document.getElementById("boot"); if (b) b.classList.add("gone"); };
    const check = () => { if (document.querySelector("#root header")) hide(); else setTimeout(check, 120); };
    setTimeout(check, 300);
    setTimeout(hide, 4000);
  })();
</script>

</body></html>
